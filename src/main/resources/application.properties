spring.application.name=sistema-ocorrencias

# Credenciais apenas por variavel de ambiente (nunca no repositorio).
# DB_URL: jdbc:postgresql://<host-do-pooler>:5432/postgres?sslmode=require
# DB_USER: postgres.<project-ref>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema e criado/alterado apenas pelo Flyway; o Hibernate so confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# O Render injeta PORT.
server.port=${PORT:8080}

spring.application.name=sistema-ocorrencias

# Credenciais apenas por variavel de ambiente (nunca no repositorio).
# DB_URL: jdbc:postgresql://<host-do-pooler>:5432/postgres?sslmode=require
# DB_USER: postgres.<project-ref>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema e criado/alterado apenas pelo Flyway; o Hibernate so confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# O Render injeta PORT.
server.port=${PORT:8080}

# Sessao (cookie JSESSIONID)
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
# Em producao, com frontend em outro dominio e HTTPS:
# SESSION_COOKIE_SAME_SITE=none e SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# CORS: origens do frontend separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# Redirecionamento pos-login (ajustar quando o frontend definir as rotas)
app.auth.redirect.professor=${REDIRECT_PROFESSOR:/professor}
app.auth.redirect.coordenacao=${REDIRECT_COORDENACAO:/coordenacao}

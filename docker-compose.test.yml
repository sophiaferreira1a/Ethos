# PostgreSQL descartavel para os testes de integracao (banco SEPARADO do Supabase).
#
#   docker compose -f docker-compose.test.yml up -d
#   # PowerShell:
#   $env:TEST_DB_URL="jdbc:postgresql://localhost:5433/ocorrencias_test"
#   $env:TEST_DB_USER="teste"
#   $env:TEST_DB_PASSWORD="teste"
#   .\mvnw.cmd test
#   docker compose -f docker-compose.test.yml down
#
# Os dados ficam em memoria (tmpfs): somem quando o container para.
services:
  postgres-teste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ocorrencias_test
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
